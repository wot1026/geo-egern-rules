# sources.yaml
# 定义每个输出分类对应的上游数据源。
# 每个 category 会生成:
#   egern/<category>.yaml   (Egern 规则集，DOMAIN-SUFFIX/DOMAIN/DOMAIN-KEYWORD)
#   loon/<category>.list    (Loon 规则集)
#
# source.type:
#   clash_yaml      - blackmatrix7 风格 Clash yaml，payload 数组，形如 "DOMAIN-SUFFIX,xxx.com"
#   dnsmasq_conf    - felixonmars dnsmasq-china-list 风格，server=/domain/1.2.3.4
#   domain_list_custom - Loyalsoldier domain-list-custom 风格，"domain:xxx.com" / "full:xxx.com" / "regexp:xxx"
#   plain_hosts     - WindowsSpyBlocker 风格，"0.0.0.0 domain.com"
#   raw_list        - 纯域名/规则行文本（可能已经是 full:/keyword:/regexp: 前缀，或裸域名按 suffix 处理）
#
# action: PROXY | DIRECT | REJECT   -> 决定输出到 Egern/Loon 时用哪个策略占位符
#         实际策略名由 convert 脚本里的 policy_map 决定，这里只标记语义分类

categories:

  # ---------------- 直连：中国大陆域名 ----------------
  china_direct:
    action: DIRECT
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml
      - type: domain_list_custom
        url: https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/cn.txt
        exclude_keywords: [google, manhua, ooklaserver, acg.rip]

  google_cn:
    action: DIRECT
    sources:
      - type: dnsmasq_conf
        url: https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf

  apple_cn:
    action: DIRECT
    sources:
      - type: dnsmasq_conf
        url: https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf

  # ---------------- 代理：全球域名白名单 ----------------
  global_proxy:
    action: PROXY
    sources:
      - type: domain_list_custom
        url: https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/geolocation-!cn.txt
        exclude_suffix_cn: true

  # ---------------- 代理：分类服务 ----------------
  google:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml

  github:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml

  netflix:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml

  openai:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml
    extra_domains:
      - "full:o33249.ingest.sentry.io"
      - "openai.com"

  telegram:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.yaml

  twitter:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.yaml

  tiktok:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml

  youtube:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml

  spotify:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml

  microsoft:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.yaml

  onedrive:
    action: DIRECT
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.yaml
    extra_domains:
      - "sharepoint.cn"

  apple_global:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple_Classical.yaml

  applemusic:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleMusic/AppleMusic.yaml

  bilibili:
    action: DIRECT
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BiliBili/BiliBili.yaml

  abema:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AbemaTV/AbemaTV.yaml

  bahamut:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bahamut/Bahamut.yaml

  cloudflare:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Cloudflare/Cloudflare.yaml

  private_tracker:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PrivateTracker/PrivateTracker.list

  global_media:
    action: PROXY
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.yaml

  # ---------------- 拒绝：广告/隐私/追踪 ----------------
  block_httpdns:
    action: REJECT
    sources:
      - type: clash_yaml
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/BlockHttpDNS/BlockHttpDNS.list

  windows_spy:
    action: REJECT
    sources:
      - type: plain_hosts
        url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
      - type: plain_hosts
        url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/update.txt
      - type: plain_hosts
        url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/extra.txt
